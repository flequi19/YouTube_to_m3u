import os
import subprocess

# Carpeta actual del script (scripts/)
base_dir = os.path.dirname(__file__)

# Archivo de canales en la raíz del repo
info_file = os.path.join(base_dir, "../youtube_channel_info.txt")
outfile = os.path.join(base_dir, "../youtube.m3u")

with open(info_file, "r", encoding="utf-8") as f:
    channels = [line.strip() for line in f if line.strip()]

with open(outfile, "w", encoding="utf-8") as f:
    f.write("#EXTM3U\n")
    for ch in channels:
        try:
            # Ejecuta yt-dlp directamente para obtener el stream
            stream_url = subprocess.check_output(["yt-dlp", "-g", ch], text=True).strip()
            f.write(f"#EXTINF:-1, {ch}\n")
            f.write(stream_url + "\n")
        except Exception as e:
            f.write(f"#EXTINF:-1, ERROR {ch}\n")
            f.write("ERROR\n")

print(f"✅ Archivo M3U generado: {outfile}")


